[package]
name = "opencode-sandbox"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
tempfile = "3"
shellexpand = "3"
libc = "0.2"
ureq = { version = "3", features = ["json"] }
